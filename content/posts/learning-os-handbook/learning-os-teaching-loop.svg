h.py</text><text x="290.0" y="466.8" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">list-projects</text><text x="290.0" y="484.2" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle"></text><text x="290.0" y="501.8" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">new-session &lt;project&gt; &quot;主题&quot;</text><text x="290.0" y="519.2" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">或对 Agent 说：继续学习 &lt;project&gt;</text><text x="290.0" y="536.8" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle"></text><text x="290.0" y="554.2" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">从本次会话提炼概念</text><text x="290.0" y="571.8" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">生成今天的复习任务</text><text x="290.0" y="589.2" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle"></text><text x="290.0" y="606.8" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">vault_health.py</text><text x="290.0" y="624.2" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">git commit -m &quot;learn: 主题&quot;</text><text x="290.0" y="641.8" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">git push</text></svg>