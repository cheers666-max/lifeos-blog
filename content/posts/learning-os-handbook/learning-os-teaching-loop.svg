<svg xmlns="http://www.w3.org/2000/svg" width="1352" height="918" viewBox="-40 -150 1352 918"><rect x="-40" y="-150" width="1352" height="918" fill="#fff"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#495057"/></marker></defs><text x="0" y="-82.0" font-size="28" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="start">一次学习会话 · 教学循环与文件产出</text><text x="0" y="-54.0" font-size="14" font-family="PingFang SC, Helvetica" fill="#868e96" text-anchor="start">一次一个节点，答错不推进；过程进 Sessions，结论进 Knowledge</text><rect x="0" y="0" width="195" height="96" rx="8" fill="#ffec99" stroke="#f08c00" stroke-width="2"/><text x="97.5" y="44.2" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">Probe</text><text x="97.5" y="63.0" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">诊断 3-5 题</text><rect x="241" y="0" width="195" height="96" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text x="338.5" y="44.2" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">Plan</text><text x="338.5" y="63.0" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">节点 + 通过标准</text><line x1="201" y1="48.0" x2="235" y2="48.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="482" y="0" width="195" height="96" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text x="579.5" y="44.2" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">Teach</text><text x="579.5" y="63.0" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">单节点五段式</text><line x1="442" y1="48.0" x2="476" y2="48.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="723" y="0" width="195" height="96" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text x="820.5" y="44.2" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">Quiz</text><text x="820.5" y="63.0" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">2-3 道校准题</text><line x1="683" y1="48.0" x2="717" y2="48.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><rect x="964" y="0" width="195" height="96" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1061.5" y="44.2" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">Persist</text><text x="1061.5" y="63.0" font-size="15" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">沉淀五处产出</text><line x1="924" y1="48.0" x2="958" y2="48.0" stroke="#495057" stroke-width="2" marker-end="url(#a)"/><line x1="820.5" y1="104" x2="820.5" y2="158" stroke="#e03131" stroke-width="2" stroke-dasharray="6,5"/><line x1="820.5" y1="158" x2="579.5" y2="158" stroke="#e03131" stroke-width="2" stroke-dasharray="6,5"/><line x1="579.5" y1="158" x2="579.5" y2="104" stroke="#e03131" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#a)"/><text x="608.0" y="182.0" font-size="14" font-family="PingFang SC, Helvetica" fill="#e03131" text-anchor="start">答错 → 换类比重讲，停在本节点</text><text x="700" y="278.0" font-size="16" font-family="PingFang SC, Helvetica" fill="#2f9e44" text-anchor="start">Persist 必须落到五处 —— 少一处，这次学习就没有留下资产</text><rect x="852" y="300" width="420" height="74" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1062.0" y="333.5" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">Sessions/&lt;会话&gt;.md</text><text x="1062.0" y="351.0" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">过程、探索、答错的题</text><rect x="852" y="388" width="420" height="74" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text x="1062.0" y="421.5" font-size="14" font-family="PingFang SC, Helvetica" fill="#1e1e1e" text-anchor="middle">Project.md</text><text x="10