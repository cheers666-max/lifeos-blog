baseURL: "http://35.208.201.12/"
locale: "zh-cn"
title: "LifeOS"
theme: "PaperMod"

# Enable RSS
enableRobotsTXT: true
enableEmoji: true

# Build options
buildDrafts: false
buildFuture: false
buildExpired: false

# Minification
minify:
  disableXML: true
  minifyOutput: true

# Menu
menu:
  main:
    - identifier: flows
      name: 心流
      url: /flows/
      weight: 1
    - identifier: links
      name: 推荐
      url: /links/
      weight: 6
    - identifier: series
      name: 系列
      url: /series/
      weight: 5
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: search
      name: 搜索
      url: /search/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 40

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  # 首页主列表只放正式文章；心流走 /flows/ 自己的流
  mainSections: ["posts"]
  # 首页主卡展示哪个系列（留空则自动取最近更新的那个）
  featuredSeries: "Claude Code Harness 内部架构"
  title: LifeOS
  description: "先建直觉、再上公式、最后算给你看 —— 大模型对齐算法、Claude Code 内部机制与 Obsidian 学习系统的深度笔记"
  keywords: [DPO, IPO, GRPO, RLHF, 偏好优化, 大模型对齐, Claude Code, Agent, Harness, Obsidian, 学习系统]
  author: "Ajing"

  # Default theme: auto (system), dark, light
  defaultTheme: auto
  disableThemeToggle: false

  # Profile/homepage mode
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: false
  ShowToc: true
  TocOpen: false

  # Homepage
  homeInfoParams:
    Title: "先建直觉，再上公式，最后算给你看"
    Content: |
      我是 Ajing，做大模型训练（PPT 生成方向）。这里记录我把一个概念真正学懂的全过程——不是笔记摘抄，是从「为什么要有它」一路推到「这个数字是怎么算出来的」。

      规矩只有一条：**每个公式后面立刻跟一句「算给你看」和真实数字**。讲不清给八岁小孩听的，就是还没懂。

      下面是正在写的几个系列，每个都能从第一篇顺着读下去。

  # Social icons
  socialIcons:
    - name: github
      url: "https://github.com/cheers666-max"
    - name: rss
      url: "index.xml"

  # Search (using Fuse.js)
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # Analytics (optional, add later)
  # googleAnalyticsID: "G-XXXXXXXXXX"

  # Comments (optional, add later)
  # giscus:
  #   repo: ""
  #   repoID: ""
  #   category: ""
  #   categoryID: ""

# 心流：日期式永久链接（同日多条靠文件名区分）
permalinks:
  flows: /flows/:year/:month/:day/:contentbasename/

# Taxonomies
taxonomies:
  category: categories
  tag: tags
  series: series

# Privacy settings
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
  instagram:
    disable: true
  x:
    disable: true
  vimeo:
    disable: true
  youtube:
    disable: true

# 数学渲染(KaTeX):passthrough 把 $...$ / $$...$$ 原样放行,交给客户端 KaTeX 渲染
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          inline:
            - ["$", "$"]
            - ["\\(", "\\)"]
          block:
            - ["$$", "$$"]
            - ["\\[", "\\]"]
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  highlight:
    style: "github-dark"
    noClasses: false
    tabWidth: 2
    lineNos: false
    guessSyntax: true

# 站点级默认值（可被单个页面的 front-matter 覆盖）
cascade:
  - target:
      kind: page
    ShowToc: true
    TocOpen: false
    ShowReadingTime: true
    ShowWordCount: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
